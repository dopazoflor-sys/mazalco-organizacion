<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazalco</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1c1c1c;
    --bg:#fafafa;
    --card:#ffffff;
    --line:#e2e2e2;
    --muted:#8a8a8a;
    --accent:#1c1c1c;
    --danger:#b23b3b;
    --backlog:#9a9a9a;
    --review:#c98a2e;
    --todo:#3a6fb0;
    --inprogress:#7a4fc9;
    --done:#3f8f5f;
    /* Paleta del organigrama Mazalco */
    --brand:#6e1b54;
    --brand-dark:#54123f;
    --flor:#6e1b54;
    --diseno:#1e7145;
    --galeria:#b01b63;
    --varios1:#4b3f9c;
    --mina:#c2591e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 90px;}
  header.top{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap;gap:10px;
  }
  .title{font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--brand);}
  .sos{
    font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;
  }
  .sos b{color:var(--ink);}
  .tabs{display:flex;gap:6px;margin-bottom:18px;}
  .tab-btn{
    padding:7px 14px;border:1px solid var(--line);background:var(--card);
    border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted);
  }
  .tab-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  section{margin-bottom:36px;}
  h2{font-size:15px;font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}

  .new-issue-btn{
    padding:8px 16px;border:1px solid var(--brand);background:var(--brand);color:#fff;
    border-radius:6px;font-size:13px;cursor:pointer;margin-bottom:14px;
  }

  .issue-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;
  }
  .issue-row:hover{border-color:#c9c9c9;}
  .issue-check{width:16px;height:16px;flex:none;}
  .issue-title{flex:1;font-size:14px;font-weight:600;}
  .issue-title small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px;}
  .badge{
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;color:#fff;flex:none;
  }
  .assignees{display:flex;gap:3px;flex:none;}
  .chip-sm{
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;font-weight:700;
  }

  .kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:stretch;}
  .kanban-col{
    flex:0 0 200px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;
    transition:background .12s;min-height:240px;display:flex;flex-direction:column;
  }
  .kanban-col.drag-over{background:#eef0ff;}
  .kanban-col h3{
    font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;color:var(--muted);
    display:flex;justify-content:space-between;
  }
  .kanban-cards{flex:1;display:flex;flex-direction:column;}
  .kanban-cards:empty{
    display:flex;align-items:center;justify-content:center;min-height:60px;
    border:1px dashed var(--line);border-radius:6px;
  }
  .kanban-cards:empty::before{content:"Soltá acá";color:var(--muted);font-size:12px;font-style:italic;}
  .kanban-card{
    background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;
    font-size:13px;font-weight:600;margin-bottom:8px;cursor:grab;
  }
  .kanban-card:hover{border-color:#c9c9c9;}
  .kanban-card.dragging{opacity:.4;}
  .kanban-card .k-assignees{display:flex;gap:3px;margin-top:6px;}

  .estado-group{margin-bottom:20px;border-radius:10px;transition:background .12s;}
  .estado-group-head{
    display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.03em;color:var(--muted);margin-bottom:8px;padding:0 2px;
  }
  .estado-group-head .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .estado-group-head .count{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;}
  .estado-group-body{min-height:56px;border-radius:8px;transition:background .12s;}
  .estado-group-body.drag-over{background:#eef0ff;}
  .estado-group-body:empty{
    display:flex;align-items:center;justify-content:center;
    border:1px dashed var(--line);border-radius:8px;
  }
  .estado-group-body:empty::before{content:"Soltá un issue acá";color:var(--muted);font-size:12px;font-style:italic;}
  .issue-row{cursor:grab;}
  .issue-row.dragging{opacity:.4;}
  .issue-row.drop-before, .kanban-card.drop-before{box-shadow:0 -2px 0 0 var(--brand);}
  .issue-row.drop-after,  .kanban-card.drop-after{box-shadow:0 2px 0 0 var(--brand);}

  .kanban-card .k-head{display:flex;align-items:flex-start;gap:7px;}

  .header-right{display:flex;align-items:center;gap:10px;}
  .badge-btn{
    width:32px;height:32px;flex:none;border:1px solid var(--line);background:var(--card);
    border-radius:50%;cursor:pointer;font-size:15px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;
  }
  .badge-btn:hover{border-color:var(--brand);color:var(--brand);}
  .sos{cursor:pointer;}
  .sos:hover b{text-decoration:underline;}

  .issues-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .issues-head .new-issue-btn{margin-bottom:0;}
  .issues-head .tabs{margin-bottom:0;}

  .bulk-bar{
    display:flex;align-items:center;gap:14px;padding:9px 12px;margin-bottom:12px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:13px;flex-wrap:wrap;
  }
  .bulk-all{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);white-space:nowrap;}
  .bulk-count{color:var(--muted);white-space:nowrap;}
  .bulk-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
  .bulk-actions .btn:disabled{opacity:.4;cursor:not-allowed;}

  table.agenda{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table.agenda th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
    background:var(--bg);padding:9px 12px;border-bottom:1px solid var(--line);
  }
  table.agenda td{
    padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;
  }
  table.agenda td[contenteditable]:hover{background:#f5f5f5;cursor:text;}
  table.agenda tr:last-child td{border-bottom:none;font-weight:700;}

  .quien-sos{display:flex;flex-wrap:wrap;gap:8px;}
  .persona-chip{
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;
    border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;
  }
  .persona-chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .persona-chip.selected{border-color:var(--brand);background:var(--brand);color:#fff;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff;border-radius:10px;padding:22px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:5px;}
  .field input[type=text], .field textarea, .field select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .estado-opts, .asignado-opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt-btn{
    padding:6px 11px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:12px;cursor:pointer;
  }
  .opt-btn.sel{background:var(--brand);color:#fff;border-color:var(--brand);}

  .subissues-list{margin-bottom:8px;}
  .subissue-row{padding:8px 0;border-bottom:1px solid var(--line);border-radius:6px;transition:background .12s;cursor:grab;}
  .subissue-row:last-child{border-bottom:none;}
  .subissue-row.dragging{opacity:.4;}
  .subissue-row.drag-over{background:#f0f0f0;}
  .subissue-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px;}
  .subissue-grip{flex:none;color:var(--muted);font-size:13px;line-height:1;padding-top:1px;user-select:none;}
  .subissue-titulo{flex:1;font-size:13px;font-weight:600;color:var(--ink);word-break:break-word;}
  .subissue-row .subissue-estado{
    width:auto;display:inline-block;
    font-size:11px;font-weight:600;color:#fff;border:none;border-radius:20px;padding:4px 10px;
    cursor:pointer;
  }
  .subissue-del{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;flex:none;
  }
  .subissue-del:hover{color:var(--danger);}
  .subissue-add-row{display:flex;gap:6px;margin-top:6px;}
  .subissue-add-row input{
    flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;
  }
  .subissue-add-row .btn{padding:7px 12px;}
  .subissue-empty{color:var(--muted);font-size:12px;font-style:italic;padding:4px 0;}
  .subissue-count{
    font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:1px 7px;flex:none;
  }

  #overlay .modal{max-width:940px;}
  #personaOverlay{z-index:60;}
  .issue-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;}
  .issue-side{border-left:1px solid var(--line);padding-left:26px;display:flex;flex-direction:column;min-width:0;}
  #fDesc{min-height:150px;}
  @media (max-width:780px){
    .issue-layout{grid-template-columns:1fr;}
    .issue-side{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:16px;}
  }
  .comentarios-list{flex:1;overflow-y:auto;max-height:50vh;margin-bottom:10px;}
  .comentario{padding:10px 0;border-bottom:1px solid var(--line);}
  .comentario:last-child{border-bottom:none;}
  .comentario-head{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:5px;}
  .comentario-head b{color:var(--ink);}
  .comentario-fecha{color:var(--muted);}
  .comentario-texto{font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .comentario-head .subissue-del{margin-left:auto;}
  .comentario-form textarea{
    width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    font-size:13px;font-family:inherit;resize:vertical;
  }
  .comentario-form-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);}

  .issue-updated{font-size:12px;color:var(--muted);flex:none;min-width:64px;text-align:right;white-space:nowrap;}
  .k-updated{font-size:11px;color:var(--muted);font-weight:400;margin-left:auto;}
  .kanban-card .k-assignees{align-items:center;}

  .filtros{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px;}
  .filtros-label{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-right:4px;}
  .filtro-chip{
    display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:16px;
    border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .filtro-chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .filtro-chip.sel{border-color:var(--brand);background:var(--brand);color:#fff;}

  .lt-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px;}
  .btn{padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn.danger{color:var(--danger);border-color:var(--danger);background:#fff;}
  .links-list a{display:block;font-size:12px;color:#3a6fb0;margin-top:3px;word-break:break-all;}
  .empty{color:var(--muted);font-size:13px;padding:16px;text-align:center;}
  .saving{opacity:.5;pointer-events:none;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title">Mazalco</div>
    <div class="header-right">
      <button class="badge-btn" id="agendaBadgeBtn" onclick="openAgendaPopup()" title="Reunión semanal" aria-label="Reunión semanal">🛡️</button>
      <div class="sos" onclick="openPersonaPicker()" title="Cambiar quién sos">Sos: <b id="sosLabel">—</b></div>
    </div>
  </header>

  <section>
    <div class="issues-head">
      <button class="new-issue-btn" onclick="openModal()">+ Nuevo issue</button>
      <div class="tabs">
        <button class="tab-btn active" id="tabLista" onclick="setView('lista')">Lista</button>
        <button class="tab-btn" id="tabKanban" onclick="setView('kanban')">Kanban</button>
      </div>
    </div>

    <div class="filtros" id="filtros"></div>

    <div class="bulk-bar" id="bulkBar" style="display:none">
      <label class="bulk-all">
        <input type="checkbox" id="selectAllChk" onchange="toggleSelectAll(this.checked)">
        Seleccionar todos
      </label>
      <span class="bulk-count" id="bulkCount"></span>
      <div class="bulk-actions">
        <button class="btn" id="btnBulkLongterm" onclick="bulkLongterm()">Long-term</button>
        <button class="btn" id="btnBulkMerge" onclick="bulkMerge()">Fusionar</button>
        <button class="btn danger" id="btnBulkDelete" onclick="bulkDelete()">Eliminar</button>
      </div>
    </div>

    <div id="listaView"></div>
    <div id="kanbanView" style="display:none"></div>
  </section>

</div>

<div class="overlay" id="agendaOverlay">
  <div class="modal">
    <h3>Reunión semanal</h3>
    <table class="agenda">
      <thead>
        <tr><th>Estructura</th><th>Agenda</th><th>Inicio</th></tr>
      </thead>
      <tbody id="agendaBody"></tbody>
    </table>
    <div class="modal-actions" style="justify-content:flex-end">
      <button class="btn" onclick="closeAgendaPopup()">Cerrar</button>
    </div>
  </div>
</div>

<div class="overlay" id="personaOverlay">
  <div class="modal">
    <h3>¿Quién sos?</h3>
    <div class="quien-sos" id="quienSosPicker"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Nuevo issue</h3>
    <div class="issue-layout">
    <div class="issue-main">
    <div class="field">
      <label>Título</label>
      <input type="text" id="fTitulo" placeholder="Título del issue">
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="fDesc" placeholder="Descripción"></textarea>
    </div>
    <div class="field">
      <label>Links (uno por línea)</label>
      <textarea id="fLinks" placeholder="https://..."></textarea>
    </div>
    <div class="field">
      <label>Estado</label>
      <div class="estado-opts" id="estadoOpts"></div>
    </div>
    <div class="field">
      <label>Asignado</label>
      <div class="asignado-opts" id="asignadoOpts"></div>
    </div>
    <div class="field">
      <label>Subissues</label>
      <div class="subissues-list" id="subissuesList"></div>
      <div class="subissue-add-row">
        <input type="text" id="fSubissueTitulo" placeholder="Nueva subissue..." onkeydown="if(event.key==='Enter'){event.preventDefault();addSubissue();}">
        <button type="button" class="btn" onclick="addSubissue()">+ Agregar</button>
      </div>
    </div>
    <div class="lt-row">
      <input type="checkbox" id="fLongterm">
      <label for="fLongterm">Long-term (ver más adelante)</label>
    </div>
    </div>
    <div class="issue-side">
      <div class="field" style="flex:1;display:flex;flex-direction:column;margin-bottom:0">
        <label>Comentarios</label>
        <div class="comentarios-list" id="comentariosList"></div>
        <div class="comentario-form" id="comentarioForm">
          <textarea id="fComentario" placeholder="Escribí un comentario..." onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){event.preventDefault();addComentario();}"></textarea>
          <div class="comentario-form-foot">
            <span id="comentarioFirma"></span>
            <button type="button" class="btn primary" id="btnComentar" onclick="addComentario()">Comentar</button>
          </div>
        </div>
      </div>
    </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="btnEliminar" onclick="deleteIssue()" style="display:none">Eliminar</button>
      <div style="flex:1"></div>
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="saveIssue()">Guardar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://bmgdretprlxxfamoanln.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZ2RyZXRwcmx4eGZhbW9hbmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjc1MDQsImV4cCI6MjEwMjgwMzUwNH0.jlJDsi5zEB2QETclpZ1f4ONooFF2XGAj_QPmzs7YH5w';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ESTADOS = ["Backlog","Todo","In progress","Review","Done"];
const ESTADO_COLOR = {Backlog:"var(--backlog)",Review:"var(--review)",Todo:"var(--todo)","In progress":"var(--inprogress)",Done:"var(--done)"};

const PERSONAS = [
  {id:"flor",    nombre:"Flor",     sector:"Dirección de operaciones", color:"var(--flor)"},
  {id:"andrea",  nombre:"Andrea",   sector:"Diseño",                   color:"var(--diseno)"},
  {id:"agustina",nombre:"Agustina", sector:"Galería",                  color:"var(--galeria)"},
  {id:"adolfina",nombre:"Adolfina", sector:"Varios I",                 color:"var(--varios1)"},
  {id:"mina",    nombre:"Mina",     sector:"",                         color:"var(--mina)"}
];

const AGENDA_DEFAULT = [
  ["Buenas noticias","5 min","10:00"],
  ["Novedades de Sybilla","5 min","10:05"],
  ["Check de issues","5 min","10:10"],
  ["Resolución de issues","60 min","10:15"],
  ["Cierre: · Revisión de To-Dos · Definir Cascade (equipo/clientes) · Meeting Score","5 min","11:15"],
  ["Termina...","","11:20"]
];

let issues = [];
let currentPersona = null;
let editingId = null;
let formEstado = "Backlog";
let formAsignados = [];
let formSubissues = [];
let currentView = "lista";
let selectedIds = new Set();
let filtroPersonas = new Set();   // vacío = todos; "sin" = sin asignar

function personaById(id){ return PERSONAS.find(p=>p.id===id); }
function initials(nombre){ return nombre.slice(0,2).toUpperCase(); }

// ── Supabase helpers ──────────────────────────────────────────────────────────

async function fetchIssues(){
  const { data, error } = await db.from('issues').select('*').order('created_at', { ascending: true });
  if(error){ console.error('fetchIssues', error); return []; }
  return data || [];
}

async function upsertIssue(issue){
  const { comentarios, ...row } = issue;   // los comentarios se guardan aparte (updateComentarios)
  const { error } = await db.from('issues').upsert(row, { onConflict: 'id' });
  if(error) console.error('upsertIssue', error);
}

async function removeIssue(id){
  const { error } = await db.from('issues').delete().eq('id', id);
  if(error) console.error('removeIssue', error);
}

async function fetchAgenda(){
  const { data, error } = await db.from('agenda').select('*').order('row_index', { ascending: true });
  if(error){ console.error('fetchAgenda', error); return null; }
  return data && data.length > 0 ? data : null;
}

async function upsertAgendaRow(row_index, estructura, agenda_col, inicio){
  const { error } = await db.from('agenda').upsert({ row_index, estructura, agenda_col, inicio }, { onConflict: 'row_index' });
  if(error) console.error('upsertAgendaRow', error);
}

// ── Render ────────────────────────────────────────────────────────────────────

function assigneeChips(ids, size){
  return (ids||[]).map(id=>{
    const p = personaById(id);
    if(!p) return "";
    const s = size||22;
    return `<span class="chip-sm" style="background:${p.color};width:${s}px;height:${s}px;font-size:${s*0.45}px" title="${p.nombre}">${initials(p.nombre)}</span>`;
  }).join("");
}

function tiempoRelativo(iso){
  if(!iso) return "";
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(min < 1)  return "recién";
  if(min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if(h < 24)   return `hace ${h} h`;
  const d = Math.round(h / 24);
  if(d === 1)  return "ayer";
  if(d < 7)    return `hace ${d} d`;
  return new Date(iso).toLocaleDateString("es-AR", {day:"numeric", month:"short"});
}

function lastUpdated(iss, cls){
  if(!iss.updated_at) return "";
  const full = new Date(iss.updated_at).toLocaleString("es-AR", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
  return `<span class="${cls}" title="Última actualización: ${full}">${tiempoRelativo(iss.updated_at)}</span>`;
}

function pasaFiltro(iss){
  if(filtroPersonas.size === 0) return true;
  const asig = iss.asignados || [];
  if(filtroPersonas.has("sin") && asig.length === 0) return true;
  return asig.some(id=>filtroPersonas.has(id));
}

function visibleIssues(){
  return issues.filter(pasaFiltro);
}

function renderFiltros(){

function comentariosCount(iss){

function subissueProgress(iss){

  return `<span class="subissue-count" title="Subissues">${done}/${subs.length}</span>`;
}

// Orden manual dentro de cada estado (drag & drop)
function sortIssues(items){
  const big = Number.MAX_SAFE_INTEGER;
  return [...items].sort((a,b)=>
    (a.orden ?? big) - (b.orden ?? big) ||
    String(a.created_at||"").localeCompare(String(b.created_at||""))
  );
}

// Renumera el orden de cada estado, renderiza y guarda lo que cambió (más los forceIds).
async function syncOrden(forceIds = []){
  const changed = new Map();
  ESTADOS.forEach(estado=>{
    const items = sortIssues(issues.filter(i=>i.estado===estado));
    items.forEach((iss, idx)=>{
      if(iss.orden === idx && !forceIds.includes(iss.id)) return;
      const k = issues.findIndex(i=>i.id===iss.id);
      issues[k] = { ...issues[k], orden: idx };
      changed.set(iss.id, issues[k]);
    });
  });
  render();
  await Promise.all([...changed.values()].map(upsertIssue));
}

let draggedId = null;

function onDragStart(e){
  draggedId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", draggedId);
}

function onDragEnd(e){
  e.currentTarget.classList.remove("dragging");
  draggedId = null;
  clearDropLines();
  document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));
}

function clearDropLines(){
  document.querySelectorAll(".drop-before,.drop-after").forEach(el=>el.classList.remove("drop-before","drop-after"));
}

// Soltar sobre otro issue: lo ubica antes/después de ese
function addItemDropHandlers(el, estado){
  el.addEventListener("dragover", (e)=>{
    if(!draggedId || draggedId === el.dataset.id) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    const after = e.clientY > r.top + r.height/2;
    clearDropLines();
    el.classList.add(after ? "drop-after" : "drop-before");
  });
  el.addEventListener("drop", (e)=>{
    if(!draggedId || draggedId === el.dataset.id) return;
    e.preventDefault();
    e.stopPropagation();
    const after = el.classList.contains("drop-after");
    clearDropLines();
    document.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));
    reorderIssue(draggedId, estado, el.dataset.id, after);
  });
}

async function reorderIssue(id, estado, targetId, after){
  const moving = issues.find(i=>i.id===id);
  if(!moving) return;
  const list = sortIssues(issues.filter(i=>i.estado===estado && i.id!==id));
  let pos = list.findIndex(i=>i.id===targetId);
  if(pos < 0) pos = list.length;
  else if(after) pos++;
  list.splice(pos, 0, moving);

  const now = new Date().toISOString();
  list.forEach((iss, idx)=>{
    const k = issues.findIndex(i=>i.id===iss.id);
    const cambiaEstado = iss.id === id && iss.estado !== estado;   // subir/bajar no cuenta como update
    issues[k] = { ...issues[k], orden: idx, ...(iss.id === id ? { estado } : {}), ...(cambiaEstado ? { updated_at: now } : {}) };
  });
  await syncOrden(list.map(i=>i.id));
}

function addDropHandlers(hitArea, estado, highlightEl){
  const target = highlightEl || hitArea;
  hitArea.addEventListener("dragover", (e)=>{
    e.preventDefault();
    if(!e.target.closest("[data-id]")) clearDropLines();
    e.dataTransfer.dropEffect = "move";
    target.classList.add("drag-over");
  });
  hitArea.addEventListener("dragleave", (e)=>{
    if(e.relatedTarget && hitArea.contains(e.relatedTarget)) return;
    target.classList.remove("drag-over");
  });
  hitArea.addEventListener("drop", (e)=>{
    e.preventDefault();
    target.classList.remove("drag-over");
    const id = draggedId || e.dataTransfer.getData("text/plain");
    if(id) moveIssueToEstado(id, estado);
  });
}

async function moveIssueToEstado(id, estado){
  const idx = issues.findIndex(i=>i.id===id);
  if(idx<0 || issues[idx].estado === estado) return;
  issues[idx] = { ...issues[idx], estado, orden: Date.now(), updated_at: new Date().toISOString() };
  await syncOrden([id]);
}

function render(){
  const lista  = document.getElementById("listaView");
  const kanban = document.getElementById("kanbanView");

  lista.innerHTML = "";
  renderFiltros();
  const visibles = visibleIssues();

  if(issues.length === 0){
    lista.innerHTML = '<div class="empty">Sin issues todavía. Creá el primero con "+ Nuevo issue".</div>';
  } else {
    ESTADOS.forEach(estado=>{
      const items = sortIssues(visibles.filter(i=>i.estado===estado));
      const group = document.createElement("div");
      group.className = "estado-group";

      const head = document.createElement("div");
      head.className = "estado-group-head";
      head.innerHTML = `<span class="dot" style="background:${ESTADO_COLOR[estado]}"></span>${estado} <span class="count">${items.length}</span>`;
      group.appendChild(head);

      const body = document.createElement("div");
      body.className = "estado-group-body";

      items.forEach(iss=>{
        const row = document.createElement("div");
        row.className = "issue-row";
        row.draggable = true;
        row.dataset.id = iss.id;
        row.onclick = ()=>openModal(iss.id);
        row.addEventListener("dragstart", onDragStart);
        row.addEventListener("dragend", onDragEnd);
        addItemDropHandlers(row, estado);
        row.innerHTML = `
          <input type="checkbox" class="issue-check" ${selectedIds.has(iss.id) ? "checked" : ""}>
          <span class="badge" style="background:${ESTADO_COLOR[iss.estado]||'#999'}">${iss.estado}</span>
          <span class="issue-title">${iss.titulo}${iss.longterm ? ' <small>Long-term</small>' : ''}</span>
          ${subissueProgress(iss)}
          ${comentariosCount(iss)}
          <span class="assignees">${assigneeChips(iss.asignados)}</span>
          ${lastUpdated(iss, "issue-updated")}
        `;
        const chk = row.querySelector(".issue-check");
        chk.onclick = (e)=>e.stopPropagation();
        chk.onchange = ()=>toggleSelect(iss.id, chk.checked);
        body.appendChild(row);
      });

      group.appendChild(body);
      addDropHandlers(group, estado, body);
      lista.appendChild(group);
    });
  }

  kanban.innerHTML = "";
  const board = document.createElement("div");
  board.className = "kanban";
  ESTADOS.forEach(estado=>{
    const col = document.createElement("div");
    col.className = "kanban-col";
    const items = sortIssues(visibles.filter(i=>i.estado===estado));
    const h3 = document.createElement("h3");
    h3.innerHTML = `${estado} <span>${items.length}</span>`;
    col.appendChild(h3);
    const cards = document.createElement("div");
    cards.className = "kanban-cards";
    items.forEach(iss=>{
      const card = document.createElement("div");
      card.className = "kanban-card";
      card.draggable = true;
      card.dataset.id = iss.id;
      card.onclick = ()=>openModal(iss.id);
      card.addEventListener("dragstart", onDragStart);
      card.addEventListener("dragend", onDragEnd);
      addItemDropHandlers(card, estado);
      card.innerHTML = `<div class="k-head"><span>${iss.titulo} ${subissueProgress(iss)} ${comentariosCount(iss)}</span></div><div class="k-assignees">${assigneeChips(iss.asignados,18)}${lastUpdated(iss, "k-updated")}</div>`;
      cards.appendChild(card);
    });
    col.appendChild(cards);
    addDropHandlers(col, estado);
    board.appendChild(col);
  });
  kanban.appendChild(board);

  renderBulkBar();
}

function toggleSelect(id, checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  render();
}

function toggleSelectAll(checked){
  if(checked) visibleIssues().forEach(i=>selectedIds.add(i.id));
  else selectedIds.clear();
  render();
}

function renderBulkBar(){
  const bar = document.getElementById("bulkBar");
  const visibles = visibleIssues();
  if(currentView !== "lista" || visibles.length === 0){
    bar.style.display = "none";
    return;
  }
  bar.style.display = "flex";

  const total    = visibles.length;
  const selected = [...selectedIds].filter(id=>visibles.some(i=>i.id===id));
  if(selected.length !== selectedIds.size){
    selectedIds = new Set(selected);
  }
  const n = selected.length;

  const allChk = document.getElementById("selectAllChk");
  allChk.checked       = n>0 && n===total;
  allChk.indeterminate = n>0 && n<total;

  document.getElementById("bulkCount").textContent = n>0 ? `${n} seleccionado${n>1?"s":""}` : "";

  document.getElementById("btnBulkLongterm").disabled = n===0;
  document.getElementById("btnBulkDelete").disabled    = n===0;
  document.getElementById("btnBulkMerge").disabled     = n<2;
}

async function bulkLongterm(){
  const ids = [...selectedIds];
  if(ids.length===0) return;
  const now = new Date().toISOString();
  ids.forEach(id=>{
    const idx = issues.findIndex(i=>i.id===id);
    if(idx>=0) issues[idx] = { ...issues[idx], longterm:true, updated_at:now };
  });
  render();
  await Promise.all(ids.map(id=>upsertIssue(issues.find(i=>i.id===id))));
}

async function bulkDelete(){
  const ids = [...selectedIds];
  if(ids.length===0) return;
  if(!confirm(`¿Eliminar ${ids.length} issue${ids.length>1?"s":""}?`)) return;
  selectedIds.clear();
  issues = issues.filter(i=>!ids.includes(i.id));
  await Promise.all(ids.map(id=>removeIssue(id)));
  await syncOrden();
}

async function bulkMerge(){
  const ids = [...selectedIds];
  if(ids.length<2) return;
  const selected = issues.filter(i=>ids.includes(i.id));
  const now = new Date().toISOString();

  const merged = {
    id:          "iss_" + Date.now(),
    titulo:      selected.map(i=>i.titulo).join(" + "),
    descripcion: selected.map(i=>i.descripcion).filter(Boolean).join("\n\n---\n\n"),
    links:       [...new Set(selected.flatMap(i=>i.links||[]))],
    longterm:    selected.some(i=>i.longterm),
    estado:      selected[0].estado,
    orden:       Math.min(...selected.map(i=>i.orden ?? Date.now())) - 0.5,
    asignados:   [...new Set(selected.flatMap(i=>i.asignados||[]))],
    comentarios: selected.flatMap(i=>i.comentarios||[]).sort((a,b)=>a.fecha.localeCompare(b.fecha)),
    created_at:  now,
    updated_at:  now
  };

  selectedIds.clear();
  issues = issues.filter(i=>!ids.includes(i.id));
  issues.push(merged);

  await Promise.all(ids.map(id=>removeIssue(id)));
  await syncOrden([merged.id]);
  if(merged.comentarios.length) await db.from('issues').update({ comentarios: merged.comentarios }).eq('id', merged.id);
}

function openModal(id){
  editingId = id || null;
  const issue = id ? issues.find(i=>i.id===id) : null;

  document.getElementById("modalTitle").textContent = issue ? "Editar issue" : "Nuevo issue";
  document.getElementById("fTitulo").value   = issue ? issue.titulo      : "";
  document.getElementById("fDesc").value     = issue ? issue.descripcion : "";
  document.getElementById("fLinks").value    = issue ? (issue.links||[]).join("\n") : "";
  document.getElementById("fLongterm").checked = issue ? issue.longterm : false;
  document.getElementById("btnEliminar").style.display = issue ? "inline-block" : "none";

  formEstado    = issue ? issue.estado : "Backlog";
  formAsignados = issue ? [...(issue.asignados||[])] : (currentPersona ? [currentPersona] : []);
  formSubissues = issue ? (issue.subissues||[]).map(s=>({...s})) : [];

  renderEstadoOpts();
  renderAsignadoOpts();
  renderSubissues();
  document.getElementById("fComentario").value = "";
  renderComentarios();
  document.getElementById("overlay").classList.add("open");
}

function renderEstadoOpts(){

    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt-btn" + (formEstado===e ? " sel" : "");
    b.textContent = e;
    b.onclick = ()=>{ formEstado = e; renderEstadoOpts(); };
    el.appendChild(b);
  });
}

function renderAsignadoOpts(){
  const el = document.getElementById("asignadoOpts");
  el.innerHTML = "";
  PERSONAS.forEach(p=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt-btn" + (formAsignados.includes(p.id) ? " sel" : "");
    b.textContent = p.nombre;
    b.onclick = ()=>{
      if(formAsignados.includes(p.id)) formAsignados = formAsignados.filter(x=>x!==p.id);
      else formAsignados.push(p.id);
      renderAsignadoOpts();
    };
    el.appendChild(b);
  });
}

let draggedSubIndex = null;

function renderSubissues(){
  const el = document.getElementById("subissuesList");
  el.innerHTML = "";
  if(formSubissues.length === 0){
    el.innerHTML = '<div class="subissue-empty">Sin subissues.</div>';
    return;
  }
  formSubissues.forEach((sub, idx)=>{
    const row = document.createElement("div");
    row.className = "subissue-row";
    row.draggable = true;

    row.addEventListener("dragstart", (e)=>{
      draggedSubIndex = idx;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(idx));
    });
    row.addEventListener("dragend", ()=>{
      row.classList.remove("dragging");
      draggedSubIndex = null;
    });
    row.addEventListener("dragover", (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", (e)=>{
      if(e.relatedTarget && row.contains(e.relatedTarget)) return;
      row.classList.remove("drag-over");
    });
    row.addEventListener("drop", (e)=>{
      e.preventDefault();
      row.classList.remove("drag-over");
      if(draggedSubIndex === null || draggedSubIndex === idx) return;
      const [moved] = formSubissues.splice(draggedSubIndex, 1);
      const target = draggedSubIndex < idx ? idx - 1 : idx;
      formSubissues.splice(target, 0, moved);
      renderSubissues();
    });

    const top = document.createElement("div");
    top.className = "subissue-top";

    const grip = document.createElement("span");
    grip.className = "subissue-grip";
    grip.textContent = "⠿";
    grip.title = "Arrastrá para reordenar";

    const titulo = document.createElement("span");
    titulo.className = "subissue-titulo";
    titulo.textContent = sub.titulo;

    const del = document.createElement("button");
    del.type = "button";
    del.className = "subissue-del";
    del.textContent = "×";
    del.onclick = ()=>{
      formSubissues = formSubissues.filter(s=>s.id !== sub.id);
      renderSubissues();
    };

    top.appendChild(grip);
    top.appendChild(titulo);
    top.appendChild(del);

    const select = document.createElement("select");
    select.className = "subissue-estado";
    select.style.background = ESTADO_COLOR[sub.estado] || "#999";
    ESTADOS.forEach(e=>{
      const opt = document.createElement("option");
      opt.value = e;
      opt.textContent = e;
      if(e === sub.estado) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = ()=>{
      sub.estado = select.value;
      select.style.background = ESTADO_COLOR[sub.estado] || "#999";
    };

    row.appendChild(top);
    row.appendChild(select);
    el.appendChild(row);
  });
}

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function formatFecha(iso){
  return new Date(iso).toLocaleString("es-AR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}

function renderComentarios(){
  const el   = document.getElementById("comentariosList");
  const form = document.getElementById("comentarioForm");
  if(!editingId){
    el.innerHTML = '<div class="subissue-empty">Guardá el issue para poder comentar.</div>';
    form.style.display = "none";
    return;
  }
  form.style.display = "block";
  const p = personaById(currentPersona);
  document.getElementById("comentarioFirma").innerHTML = p ? `Comentás como <b>${p.nombre}</b>` : "Elegí quién sos para comentar";

  const iss = issues.find(i=>i.id===editingId);
  const list = (iss && iss.comentarios) || [];
  if(list.length === 0){
    el.innerHTML = '<div class="subissue-empty">Sin comentarios.</div>';
    return;
  }
  el.innerHTML = list.map(c=>{
    const autor = personaById(c.autor);
    const del = c.autor === currentPersona
      ? `<button type="button" class="subissue-del" title="Borrar comentario" onclick="deleteComentario('${c.id}')">×</button>` : "";
    return `<div class="comentario">
      <div class="comentario-head">${assigneeChips([c.autor], 20)}<b>${autor ? autor.nombre : escapeHtml(c.autor)}</b><span class="comentario-fecha">${formatFecha(c.fecha)}</span>${del}</div>
      <div class="comentario-texto">${escapeHtml(c.texto)}</div>
    </div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}

// Lee los comentarios actuales de la base antes de escribir, para no pisar los de otra persona
async function updateComentarios(id, fn){
  const { data, error } = await db.from('issues').select('comentarios').eq('id', id).single();
  if(error){ console.error('fetchComentarios', error); alert("No se pudo guardar el comentario."); return false; }
  const comentarios = fn(data.comentarios || []);
  const updated_at = new Date().toISOString();
  const { error: errUpd } = await db.from('issues').update({ comentarios, updated_at }).eq('id', id);
  if(errUpd){ console.error('updateComentarios', errUpd); alert("No se pudo guardar el comentario."); return false; }
  const k = issues.findIndex(i=>i.id===id);
  if(k>=0) issues[k] = { ...issues[k], comentarios, updated_at };
  if(editingId === id) renderComentarios();
  render();
  return true;
}

async function addComentario(){
  const input = document.getElementById("fComentario");
  const texto = input.value.trim();
  if(!texto || !editingId) return;
  if(!currentPersona){ openPersonaPicker(); return; }
  const btn = document.getElementById("btnComentar");
  btn.disabled = true;
  const c = {
    id: "com_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    autor: currentPersona,
    texto,
    fecha: new Date().toISOString()
  };
  const ok = await updateComentarios(editingId, list=>[...list, c]);
  btn.disabled = false;
  if(ok) input.value = "";
}

async function deleteComentario(cid){
  if(!editingId || !confirm("¿Borrar este comentario?")) return;
  await updateComentarios(editingId, list=>list.filter(c=>c.id!==cid));
}

function addSubissue(){
  const input = document.getElementById("fSubissueTitulo");
  const titulo = input.value.trim();
  if(!titulo) return;
  formSubissues.push({
    id: "sub_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    titulo,
    estado: "Todo"
  });
  input.value = "";
  renderSubissues();
  input.focus();
}

function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  editingId = null;
}

async function saveIssue(){
  const titulo = document.getElementById("fTitulo").value.trim();
  if(!titulo){ alert("Ponele un título al issue."); return; }
  const descripcion = document.getElementById("fDesc").value.trim();
  const links       = document.getElementById("fLinks").value.split("\n").map(l=>l.trim()).filter(Boolean);
  const longterm    = document.getElementById("fLongterm").checked;
  const now         = new Date().toISOString();
  const existing    = editingId ? issues.find(i=>i.id===editingId) : null;

  const issue = {
    id:          editingId || ("iss_" + Date.now()),
    titulo,
    descripcion,
    links,
    longterm,
    estado:      formEstado,
    orden:       existing && existing.orden != null ? existing.orden : Date.now(),
    asignados:   [...formAsignados],
    subissues:   formSubissues.map(s=>({...s})),
    updated_at:  now,
    ...(editingId ? {} : { created_at: now })
  };

  if(existing){
    const campos = ["titulo","descripcion","links","longterm","estado","asignados","subissues"];
    const cambio = campos.some(c=>JSON.stringify(issue[c] ?? null) !== JSON.stringify(existing[c] ?? null));
    if(!cambio) issue.updated_at = existing.updated_at;
  }

  await upsertIssue(issue);

  if(editingId){
    const idx = issues.findIndex(i=>i.id===editingId);
    if(idx>=0) issues[idx] = { ...issue, comentarios: issues[idx].comentarios || [] };
  } else {
    issues.push(issue);
  }

  closeModal();
  await syncOrden();
}

async function deleteIssue(){
  if(!editingId) return;
  await removeIssue(editingId);
  issues = issues.filter(i=>i.id!==editingId);
  selectedIds.delete(editingId);
  closeModal();
  await syncOrden();
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init(){
  issues = await fetchIssues();

  try{ filtroPersonas = new Set(JSON.parse(localStorage.getItem("filtro-personas") || "[]")); }catch(e){}
  currentPersona = localStorage.getItem("quien-sos") || null;
  renderQuienSos();
  if(currentPersona){
    const p = personaById(currentPersona);
    if(p) document.getElementById("sosLabel").textContent = p.nombre;
  } else {
    openPersonaPicker();
  }

  const agendaData = await fetchAgenda();
  if(agendaData){
    renderAgenda(agendaData.map(r=>[r.estructura, r.agenda_col, r.inicio]));
  } else {
    // seed defaults
    for(let i=0; i<AGENDA_DEFAULT.length; i++){
      await upsertAgendaRow(i, AGENDA_DEFAULT[i][0], AGENDA_DEFAULT[i][1], AGENDA_DEFAULT[i][2]);
    }
    renderAgenda(AGENDA_DEFAULT);
  }

  await syncOrden();
}

init();
</script>
